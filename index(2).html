<style>
:root{
  --mare:#0b4f6c; --mare2:#0e7490; --sabbia:#f6f1e7; --carta:#fffdf8; --ink:#1f2933; --muted:#6b7280;
  --linea:#e6dfd1; --ok:#15803d; --warn:#b45309; --err:#b91c1c; --r:10px;
}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--sabbia);color:var(--ink);font-size:14px}
header{background:var(--mare);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:20}
header h1{font-size:17px;margin:0;font-weight:650;letter-spacing:.2px}
header h1 span{opacity:.7;font-weight:400}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;border:0;color:#d6ecf3;padding:7px 11px;border-radius:7px;cursor:pointer;font-size:13.5px}
nav button.on,nav button:hover{background:rgba(255,255,255,.14);color:#fff}
.utente{margin-left:auto;font-size:12px;opacity:.8}
main{padding:18px;max-width:1400px;margin:0 auto}
.card{background:var(--carta);border:1px solid var(--linea);border-radius:var(--r);padding:16px;margin-bottom:16px}
.card h2{margin:0 0 12px;font-size:15px}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.g2{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.kpi .v{font-size:24px;font-weight:700;margin-top:4px}
.kpi .l{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.4px}
.kpi .s{color:var(--muted);font-size:12px;margin-top:2px}
.btn{background:var(--mare2);color:#fff;border:0;border-radius:8px;padding:8px 13px;cursor:pointer;font-size:13.5px;font-weight:550}
.btn:hover{filter:brightness(1.08)}
.btn.sec{background:#fff;color:var(--mare);border:1px solid var(--linea)}
.btn.del{background:#fff;color:var(--err);border:1px solid #f3c7c7}
.btn.sm{padding:5px 9px;font-size:12.5px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.bar .sp{flex:1}
input,select,textarea{font:inherit;padding:7px 9px;border:1px solid #d8d0c0;border-radius:7px;background:#fff;color:var(--ink);width:100%}
textarea{min-height:60px}
label{font-size:12px;color:var(--muted);display:block;margin-bottom:3px}
.f{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.f .w2{grid-column:span 2}
.chk{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--ink)}
.chk input{width:auto}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--linea);vertical-align:top}
th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.3px;font-weight:600;background:#faf6ee}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
tr.click{cursor:pointer} tr.click:hover td{background:#f8f3e8}
tfoot td{font-weight:700;background:#faf6ee}
.tag{display:inline-block;padding:2px 7px;border-radius:20px;font-size:11.5px;font-weight:600;background:#eef2f5;color:#334155;white-space:nowrap}
.tag.ok{background:#dcfce7;color:#166534}.tag.warn{background:#fef3c7;color:#92400e}.tag.err{background:#fee2e2;color:#991b1b}.tag.info{background:#e0f2fe;color:#075985}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.muted{color:var(--muted)} .small{font-size:12px}
.scroll{overflow-x:auto}
/* timeline */
.tl{min-width:900px}
.tl-row{display:grid;align-items:stretch;border-bottom:1px solid var(--linea);position:relative}
.tl-head{font-size:11px;color:var(--muted);text-align:center}
.tl-head div{padding:3px 0;border-left:1px solid #f0eadf}
.tl-head .we{background:#f4eee2}
.tl-head .oggi{background:var(--mare2);color:#fff;border-radius:4px}
.tl-name{padding:8px 8px;font-weight:600;font-size:12.5px;background:#faf6ee;border-right:1px solid var(--linea);position:sticky;left:0;z-index:2;display:flex;align-items:center}
.tl-cell{border-left:1px solid #f3eee4;min-height:40px;cursor:pointer}
.tl-cell.we{background:#fbf8f1}
.tl-cell:hover{background:#eef7fa}
.tl-bar{grid-row:1;margin:6px 1px;border-radius:6px;color:#fff;font-size:11.5px;padding:4px 6px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer;z-index:1;box-shadow:0 1px 2px rgba(0,0,0,.15)}
.tl-bar.ota{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.18) 0 6px,transparent 6px 12px)}
.tl-bar.opz{opacity:.6;border:2px dashed #fff}
/* mese singola casa */
.mese{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.mese .gs{font-size:11px;color:var(--muted);text-align:center;text-transform:uppercase}
.giorno{background:#fff;border:1px solid var(--linea);border-radius:7px;min-height:78px;padding:4px 5px;cursor:pointer;font-size:12px;position:relative}
.giorno.fuori{opacity:.35}
.giorno .num{font-weight:600;font-size:12px}
.giorno.oggi{outline:2px solid var(--mare2)}
.giorno .occ{margin-top:3px;border-radius:5px;color:#fff;padding:2px 4px;font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.giorno .prezzo{position:absolute;right:5px;top:4px;font-size:10.5px;color:var(--muted)}
/* modale */
.modal-bg{position:fixed;inset:0;background:rgba(15,23,42,.45);display:none;align-items:flex-start;justify-content:center;z-index:50;padding:30px 12px;overflow-y:auto}
.modal-bg.on{display:flex}
.modal{background:var(--carta);border-radius:12px;max-width:860px;width:100%;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.modal h3{margin:0 0 14px;font-size:17px}
.sez{font-size:12px;font-weight:700;color:var(--mare);text-transform:uppercase;letter-spacing:.5px;margin:16px 0 8px;border-top:1px solid var(--linea);padding-top:12px}
.riepilogo{background:#eef7fa;border-radius:8px;padding:10px 12px;font-size:13px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px 14px;margin-top:10px}
.riepilogo b{display:block;font-size:15px}
.avviso{background:#fef3c7;color:#78350f;border-radius:8px;padding:8px 12px;margin-top:10px;font-size:13px}
.avviso.err{background:#fee2e2;color:#7f1d1d}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#1f2933;color:#fff;padding:10px 16px;border-radius:8px;z-index:60;display:none}
.demo{background:#fde68a;color:#78350f;text-align:center;padding:6px;font-size:12.5px}
.chart svg{width:100%;height:auto}
.legenda{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;margin-top:6px}
.vuoto{color:var(--muted);padding:14px;text-align:center}
code.u{font-size:11px;background:#f1ece1;padding:3px 6px;border-radius:5px;word-break:break-all;display:block}
@media (max-width:700px){header{position:static}nav button{padding:6px 8px}.card{overflow-x:auto}td input{min-width:150px}td input[type=checkbox],td input[type=color]{min-width:0}main{padding:10px}.g2{grid-template-columns:1fr}.f .w2{grid-column:auto}header{padding:8px 10px}.utente{margin-left:0}}
</style>

function commDefault(canale, tot) { return Math.round(num(tot) * num(imp('comm_' + canale)) ) / 100; }
function casa(id) { return D.Case.find(function (c) { return c.id === id; }) || { nome: '(casa eliminata)', colore: '#999' }; }
function caseOrd() { return D.Case.slice().sort(function (a, b) { return num(a.ordine) - num(b.ordine); }); }
function attive() { return D.Prenotazioni.filter(function (p) { return p.stato !== 'cancellata'; }); }

/* ---------- Tassa di soggiorno ----------
   € X a persona sopra i 12 anni, per notte, per al massimo le prime N notti di soggiorno continuato,
   solo per le notti che cadono nei mesi indicati (default giugno–ottobre). */
function notteTassabili(p) {
  var mesi = String(imp('tassaMesi')).split(',').map(function (x) { return parseInt(x, 10); });
  var max = num(imp('tassaMaxNotti')), n = notti(p.checkin, p.checkout), out = [];
  for (var i = 0; i < Math.min(n, max); i++) {
    var g = addG(p.checkin, i);
    if (mesi.indexOf(parseInt(g.slice(5, 7), 10)) >= 0) out.push(g);
  }
  return out;
}
function personeTassa(p) { return Math.max(0, num(p.ospitiTassa) - num(p.esentiTassa)); }
function tassa(p) { return personeTassa(p) * notteTassabili(p).length * num(imp('tassaImporto')); }

/* ---------- Economia di una prenotazione ---------- */
function netto(p) { return num(p.prezzoTotale) - num(p.commissione); }
function incassato(p) {
  if (bool(p.saldoRicevuto)) return num(p.prezzoTotale);
  return bool(p.caparraRicevuta) ? num(p.caparra) : 0;
}
function residuo(p) { return Math.max(0, num(p.prezzoTotale) - incassato(p)); }
function isOtaCanale(c) { return CANALI_OTA.indexOf(c) >= 0; }

/* ---------- Tariffe ---------- */
function tariffaNotte(casaId, g) {
  var t = D.Tariffe.filter(function (t) { return t.casaId === casaId && t.dal <= g && t.al >= g; });
  if (t.length) { t.sort(function (a, b) { return notti(a.dal, a.al) - notti(b.dal, b.al); }); return { prezzo: num(t[0].prezzoNotte), min: num(t[0].minNotti), nome: t[0].nome }; }
  var c = casa(casaId); return { prezzo: num(c.tariffaBase), min: num(c.minNotti), nome: 'Base' };
}
function preventivo(casaId, ci, co) {
  var n = notti(ci, co), tot = 0, min = 0;
  for (var i = 0; i < n; i++) { var t = tariffaNotte(casaId, addG(ci, i)); tot += t.prezzo; if (i === 0) min = t.min; }
  var pul = num(casa(casaId).pulizie);
  return { notti: n, soggiorno: tot, pulizie: pul, totale: tot + pul, minNotti: min };
}

/* ---------- Occupazione e conflitti ---------- */
function eventiCasa(casaId) {
  var uidCollegati = {};
  var out = [];
  D.Prenotazioni.forEach(function (p) {
    if (p.otaUid) uidCollegati[p.otaUid] = true;
    if (p.casaId === casaId && p.stato !== 'cancellata') out.push({ tipo: 'p', id: p.id, inizio: p.checkin, fine: p.checkout, p: p });
  });
  D.EventiOTA.forEach(function (e) {
    if (e.casaId === casaId && !uidCollegati[e.uid]) out.push({ tipo: 'o', id: e.uid, inizio: e.inizio, fine: e.fine, e: e });
  });
  return out;
}
function conflitti(casaId, ci, co, escludiId, escludiUid) {
  return eventiCasa(casaId).filter(function (x) {
    if (x.tipo === 'p' && x.id === escludiId) return false;
    if (x.tipo === 'o' && x.id === escludiUid) return false;
    return x.inizio < co && x.fine > ci;
  });
}

/* =========================================================
   VISTA: PANORAMICA
   ========================================================= */
function vPanoramica() {
  var o = oggi(), tra14 = addG(o, 14), anno = o.slice(0, 4);
  var arrivi = attive().filter(function (p) { return p.checkin >= o && p.checkin <= tra14; }).sort(function (a, b) { return a.checkin < b.checkin ? -1 : 1; });
  var partenze = attive().filter(function (p) { return p.checkout >= o && p.checkout <= tra14; }).sort(function (a, b) { return a.checkout < b.checkout ? -1 : 1; });
  var inCasa = attive().filter(function (p) { return p.checkin <= o && p.checkout > o; });
  var capAttese = attive().filter(function (p) { return !isOtaCanale(p.canale) && num(p.caparra) > 0 && !bool(p.caparraRicevuta) && p.checkout >= o; });
  var saldi = attive().filter(function (p) { return !isOtaCanale(p.canale) && residuo(p) > 0 && p.checkin <= addG(o, 7) && p.checkout >= addG(o, -30); });
  var daCompletare = D.EventiOTA.filter(function (e) { return e.fine >= o && !D.Prenotazioni.some(function (p) { return p.otaUid === e.uid; }); });
  var alloggiati = attive().filter(function (p) { return p.checkin <= o && p.checkin >= addG(o, -30) && !bool(p.alloggiatiInviati); });
  var opz = attive().filter(function (p) { return p.stato === 'opzione' && p.checkout >= o; });
  var r = calcolaReport(anno + '-01-01', anno + '-12-31');

  var h = '<div class="bar"><div class="sp"></div><button class="btn" onclick="apriPren()">+ Nuova prenotazione</button></div>';
  h += '<div class="grid g4">' +
    kpi('Ospiti in casa oggi', inCasa.length, inCasa.map(function (p) { return esc(casa(p.casaId).nome.split(' ').slice(0, 2).join(' ')); }).join(', ') || '—') +
    kpi('Arrivi prossimi 14 gg', arrivi.length, partenze.length + ' partenze') +
    kpi('Incasso netto ' + anno, eur(r.tot.netto), 'occupazione ' + r.tot.occ.toFixed(0) + '%') +
    kpi('Tassa soggiorno ' + anno, eur2(r.tot.tassa), r.tot.notti + ' notti vendute') + '</div>';

  var promemoria = [];
  capAttese.forEach(function (p) { promemoria.push(['warn', 'Caparra da ricevere', p, eur(p.caparra)]); });
  saldi.forEach(function (p) { promemoria.push(['warn', 'Saldo da incassare', p, eur(residuo(p))]); });
  alloggiati.forEach(function (p) { promemoria.push(['err', 'Alloggiati Web da inviare', p, '']); });
  opz.forEach(function (p) { promemoria.push(['info', 'Opzione da confermare', p, '']); });

  h += '<div class="grid g2" style="margin-top:16px">';
  h += '<div class="card"><h2>Arrivi e partenze (prossimi 14 giorni)</h2>' + tabMovimenti(arrivi, partenze) + '</div>';
  h += '<div class="card"><h2>Promemoria</h2>';
  if (!promemoria.length && !daCompletare.length) h += '<div class="vuoto">Tutto in ordine ✓</div>';
  else {
    h += '<table>';
    promemoria.forEach(function (x) {
      h += '<tr class="click" onclick="apriPren(\'' + x[2].id + '\')"><td><span class="tag ' + x[0] + '">' + x[1] + '</span></td><td>' + esc(x[2].ospite) +
        '<div class="small muted">' + esc(casa(x[2].casaId).nome) + ' · ' + fd(x[2].checkin) + '</div></td><td class="n">' + x[3] + '</td></tr>';
    });
    daCompletare.forEach(function (e) {
      h += '<tr class="click" onclick="daOta(\'' + esc(e.uid) + '\')"><td><span class="tag info">Da completare (' + esc(e.fonte) + ')</span></td><td>' + esc(e.titolo || 'Prenotazione OTA') +
        '<div class="small muted">' + esc(casa(e.casaId).nome) + ' · ' + fd(e.inizio) + ' → ' + fd(e.fine) + '</div></td><td class="n small muted">aggiungi dati</td></tr>';
    });
    h += '</table>';
  }
  h += '</div></div>';
  return h;
}
function kpi(l, v, s) { return '<div class="card kpi"><div class="l">' + l + '</div><div class="v">' + v + '</div><div class="s">' + (s || '') + '</div></div>'; }
function tabMovimenti(arrivi, partenze) {
  var m = [];
  arrivi.forEach(function (p) { m.push({ g: p.checkin, t: 'Arrivo', p: p, host: p.hostCheckin }); });
  partenze.forEach(function (p) { m.push({ g: p.checkout, t: 'Partenza', p: p, host: p.hostCheckout }); });
  m.sort(function (a, b) { return a.g < b.g ? -1 : a.g > b.g ? 1 : (a.t === 'Partenza' ? -1 : 1); });
  if (!m.length) return '<div class="vuoto">Nessun movimento</div>';
  return '<table><tr><th>Data</th><th></th><th>Casa / ospite</th><th>Host</th><th></th></tr>' + m.map(function (x) {
    var wa = linkWa(x.host, x.p, x.t);
    return '<tr class="click" onclick="apriPren(\'' + x.p.id + '\')"><td>' + giornoBreve(x.g) + '</td><td><span class="tag ' + (x.t === 'Arrivo' ? 'ok' : 'info') + '">' + x.t + '</span></td>' +
      '<td><span class="dot" style="background:' + casa(x.p.casaId).colore + '"></span>' + esc(casa(x.p.casaId).nome) + '<div class="small muted">' + esc(x.p.ospite) +
      ' · ' + (num(x.p.adulti) + num(x.p.bambini)) + ' osp.' + (x.t === 'Arrivo' && x.p.oraArrivo ? ' · ore ' + esc(x.p.oraArrivo) : '') + '</div></td>' +
      '<td>' + (x.host ? esc(x.host) : '<span class="tag err">da assegnare</span>') + '</td>' +
      '<td>' + (wa ? '<a class="btn sm sec" href="' + wa + '" target="_blank" onclick="event.stopPropagation()">WhatsApp</a>' : '') + '</td></tr>';
  }).join('') + '</table>';
}
function giornoBreve(g) { var d = dU(g); return GS[(d.getUTCDay() + 6) % 7] + ' ' + fd(g, false); }
function linkWa(host, p, tipo) {
  var tel = String(imp('host_' + host) || '').replace(/[^\d+]/g, '');
  if (!host || !tel) return '';
  if (tel.charAt(0) !== '+' && tel.slice(0, 2) !== '00') tel = '39' + tel;
  tel = tel.replace(/^\+|^00/, '');
  var c = casa(p.casaId);
  var msg = 'Ciao ' + host + ', ' + (tipo === 'Arrivo' ? 'check-in' : 'check-out') + ' a ' + c.nome + ' ' + giornoBreve(tipo === 'Arrivo' ? p.checkin : p.checkout) +
    (tipo === 'Arrivo' && p.oraArrivo ? ' ore ' + p.oraArrivo : '') + '. Ospite: ' + p.ospite + ' (' + (num(p.adulti) + num(p.bambini)) + ' persone)' +
    (p.telefono ? ', tel ' + p.telefono : '') + '.' +
    (tipo === 'Arrivo' && !isOtaCanale(p.canale) && residuo(p) > 0 ? ' Da incassare: ' + eur(residuo(p)) + '.' : '') +
    (tipo === 'Arrivo' && tassa(p) > 0 && !bool(p.tassaIncassata) ? ' Tassa soggiorno: ' + eur2(tassa(p)) + '.' : '');
  return 'https://wa.me/' + tel + '?text=' + encodeURIComponent(msg);
}

function vCalendario() {
  var p = S.meseCal.split('-'), y = +p[0], m = +p[1];
  var h = '<div class="bar"><button class="btn sec sm" onclick="spostaMese(-1)">◀</button><b style="font-size:16px;min-width:150px;text-align:center">' + MESI[m - 1] + ' ' + y + '</b>' +

    '<option value="tutte"' + (S.modoCal === 'tutte' ? ' selected' : '') + '>Tutte le case</option>' +
    caseOrd().map(function (c) { return '<option value="' + c.id + '"' + (S.modoCal === c.id ? ' selected' : '') + '>' + esc(c.nome) + '</option>'; }).join('') + '</select>' +
    '<div class="sp"></div><button class="btn sec" onclick="sincronizza()">⟳ Sincronizza OTA</button><button class="btn" onclick="apriPren()">+ Prenotazione</button></div>';
  h += '<div class="card">' + (S.modoCal === 'tutte' ? timeline(y, m) : meseCasa(S.modoCal, y, m)) +
    '<div class="legenda"><span><span class="dot" style="background:#64748b"></span>Prenotazione</span><span><span class="dot" style="background:repeating-linear-gradient(45deg,#64748b 0 3px,#cbd5e1 3px 6px)"></span>Dal calendario OTA (da completare)</span><span>Tratteggio = opzione non confermata</span>' +
    '<span class="muted">Clic su un giorno libero per creare una prenotazione</span></div></div>';
  return h;
}
function spostaMese(d) { var p = S.meseCal.split('-'), dt = new Date(Date.UTC(+p[0], +p[1] - 1 + d, 1)); S.meseCal = dt.toISOString().slice(0, 7); render(); }
function meseOggi() { S.meseCal = oggi().slice(0, 7); render(); }
function timeline(y, m) {
  var giorni = new Date(Date.UTC(y, m, 0)).getUTCDate(), inizio = S.meseCal + '-01', fine = addG(inizio, giorni), o = oggi();
  var cols = '210px repeat(' + giorni + ',1fr)';
  var h = '<div class="scroll"><div class="tl"><div class="tl-row tl-head" style="grid-template-columns:' + cols + '"><div></div>';
  for (var i = 0; i < giorni; i++) {
    var g = addG(inizio, i), dw = (dU(g).getUTCDay() + 6) % 7;
    h += '<div class="' + (g === o ? 'oggi' : dw >= 5 ? 'we' : '') + '">' + GS[dw].charAt(0) + '<br>' + (i + 1) + '</div>';
  }
  h += '</div>';
  caseOrd().forEach(function (c) {
    h += '<div class="tl-row" style="grid-template-columns:' + cols + '"><div class="tl-name" style="grid-row:1;grid-column:1"><span class="dot" style="background:' + c.colore + '"></span>' + esc(c.nome) + '</div>';
    for (var i = 0; i < giorni; i++) {
      var g = addG(inizio, i), dw = (dU(g).getUTCDay() + 6) % 7;
      h += '<div class="tl-cell' + (dw >= 5 ? ' we' : '') + '" style="grid-row:1;grid-column:' + (i + 2) + '" onclick="apriPren(null,{casaId:\'' + c.id + '\',checkin:\'' + g + '\'})" title="' + fd(g) + ' · ' + eur(tariffaNotte(c.id, g).prezzo) + '/notte"></div>';
    }
    eventiCasa(c.id).forEach(function (ev) {
      if (ev.fine <= inizio || ev.inizio >= fine) return;
      var a = Math.max(0, notti(inizio, ev.inizio)), b = Math.min(giorni, notti(inizio, ev.fine));
      var span = Math.max(1, b - a);
      var lbl, cls = 'tl-bar', click, tit;
      if (ev.tipo === 'p') {
        lbl = esc(ev.p.ospite) + (ev.p.hostCheckin ? ' · ' + esc(ev.p.hostCheckin) : '');
        if (ev.p.stato === 'opzione') cls += ' opz';
        click = 'apriPren(\'' + ev.id + '\')';
        tit = ev.p.ospite + ' · ' + ev.p.canale + ' · ' + fd(ev.inizio) + '→' + fd(ev.fine);
      } else {
        lbl = esc(ev.e.fonte) + ' · ' + esc(ev.e.titolo || 'occupato'); cls += ' ota'; click = 'daOta(\'' + esc(ev.id) + '\')';
        tit = ev.e.fonte + ' (da completare) ' + fd(ev.inizio) + '→' + fd(ev.fine);
      }
      h += '<div class="' + cls + '" style="grid-column:' + (a + 2) + ' / span ' + span + ';background-color:' + c.colore + '" onclick="' + click + '" title="' + esc(tit) + '">' + lbl + '</div>';
    });
    h += '</div>';
  });
  return h + '</div></div>';
}
function meseCasa(casaId, y, m) {
  var c = casa(casaId), primo = S.meseCal + '-01', o = oggi();
  var off = (dU(primo).getUTCDay() + 6) % 7, start = addG(primo, -off);
  var ev = eventiCasa(casaId);
  var h = '<div class="mese">' + GS.map(function (g) { return '<div class="gs">' + g + '</div>'; }).join('');
  var gm = new Date(Date.UTC(y, m, 0)).getUTCDate(), celle = Math.ceil((off + gm) / 7) * 7;
  for (var i = 0; i < celle; i++) {
    var g = addG(start, i), fuori = g.slice(0, 7) !== S.meseCal;
    var occ = ev.filter(function (x) { return x.inizio <= g && x.fine > g; });
    var arr = ev.filter(function (x) { return x.fine === g; });
    h += '<div class="giorno' + (fuori ? ' fuori' : '') + (g === o ? ' oggi' : '') + '" onclick="' + (occ.length ? '' : 'apriPren(null,{casaId:\'' + casaId + '\',checkin:\'' + g + '\'})') + '">' +
      '<span class="num">' + (+g.slice(8)) + '</span>' + (occ.length ? '' : '<span class="prezzo">' + eur(tariffaNotte(casaId, g).prezzo) + '</span>');
    arr.forEach(function (x) { h += '<div class="small muted">↗ partenza</div>'; });
    occ.forEach(function (x) {
      var lbl = x.tipo === 'p' ? esc(x.p.ospite) : esc(x.e.fonte);
      var click = x.tipo === 'p' ? 'apriPren(\'' + x.id + '\')' : 'daOta(\'' + esc(x.id) + '\')';
      h += '<div class="occ" style="background:' + c.colore + (x.tipo === 'o' ? ';background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.2) 0 5px,transparent 5px 10px)' : '') + '" onclick="event.stopPropagation();' + click + '">' +
        (x.inizio === g ? '↘ ' : '') + lbl + '</div>';
    });
    h += '</div>';
  }
  return h + '</div>';
}

function apriModale(html) { $('modal').innerHTML = html; $('mbg').classList.add('on'); }
function chiudiModale() { $('mbg').classList.remove('on'); }
$('mbg').addEventListener('click', function (e) { if (e.target === $('mbg')) chiudiModale(); });

function daOta(uid) {
  var e = D.EventiOTA.find(function (x) { return x.uid === uid; }); if (!e) return;
  apriPren(null, { casaId: e.casaId, checkin: e.inizio, checkout: e.fine, canale: CANALI.indexOf(e.fonte) >= 0 ? e.fonte : 'Altro', otaUid: e.uid, note: e.titolo ? 'Da calendario: ' + e.titolo : '' });
}

function apriPren(id, preset) {
  var p = id ? JSON.parse(JSON.stringify(D.Prenotazioni.find(function (x) { return x.id === id; }))) : null;
  if (!p) {

/* =========================================================
   VISTA: GUADAGNI
   Ricavi ripartiti per notte: una prenotazione a cavallo di due mesi
   viene attribuita pro-quota a ciascun mese.
   ========================================================= */
function calcolaReport(dal, al) {
  var giorniPer = notti(dal, addG(al, 1));
  var per = {}, mesi = {};
  caseOrd().forEach(function (c) { per[c.id] = { notti: 0, lordo: 0, comm: 0, netto: 0, pul: 0, tassa: 0, spese: 0, pren: 0 }; });
  attive().filter(function (p) { return p.stato === 'confermata'; }).forEach(function (p) {
    var n = notti(p.checkin, p.checkout); if (n <= 0 || !per[p.casaId]) return;
    var r = per[p.casaId], dentro = 0, tass = notteTassabili(p), unitT = personeTassa(p) * num(imp('tassaImporto'));
    for (var i = 0; i < n; i++) {
      var g = addG(p.checkin, i); if (g < dal || g > al) continue;
      dentro++;
      var m = g.slice(0, 7); mesi[m] = mesi[m] || {}; mesi[m][p.casaId] = (mesi[m][p.casaId] || 0) + netto(p) / n;
      if (tass.indexOf(g) >= 0) r.tassa += unitT;
    }
    if (!dentro) return;
    var q = dentro / n;
    r.notti += dentro; r.lordo += num(p.prezzoTotale) * q; r.comm += num(p.commissione) * q; r.netto += netto(p) * q; r.pul += num(p.pulizie) * q;
    if (p.checkin >= dal && p.checkin <= al) r.pren++;
  });
  var speseComuni = 0;
  D.Spese.forEach(function (s) {
    if (s.data < dal || s.data > al) return;
    if (s.casaId && per[s.casaId]) per[s.casaId].spese += num(s.importo); else speseComuni += num(s.importo);
  });
  var tot = { notti: 0, lordo: 0, comm: 0, netto: 0, pul: 0, tassa: 0, spese: speseComuni, pren: 0 };
  Object.keys(per).forEach(function (k) { var r = per[k]; for (var x in tot) tot[x] += r[x]; r.occ = 100 * r.notti / giorniPer; r.adr = r.notti ? (r.lordo - r.pul) / r.notti : 0; r.utile = r.netto - r.spese; });
  tot.occ = 100 * tot.notti / (giorniPer * Math.max(1, caseOrd().length)); tot.adr = tot.notti ? (tot.lordo - tot.pul) / tot.notti : 0; tot.utile = tot.netto - tot.spese;
  return { per: per, tot: tot, mesi: mesi, speseComuni: speseComuni, dal: dal, al: al };
}

  if (p[0] === 'estate') return [p[1] + '-06-01', p[1] + '-09-30'];
  if (p[0] === 'mese') { var u = new Date(Date.UTC(+p[1].slice(0, 4), +p[1].slice(5, 7), 0)).toISOString().slice(0, 10); return [p[1] + '-01', u]; }
  if (p[0] === 'custom') return [S.repDal || y + '-01-01', S.repAl || y + '-12-31'];
}

function disegnaGrafico() {
  var r = S.report, el = $('grafico'); if (!el) return;
  var mesi = [], d = r.dal.slice(0, 7);
  while (d <= r.al.slice(0, 7) && mesi.length < 36) { mesi.push(d); var dt = new Date(Date.UTC(+d.slice(0, 4), +d.slice(5, 7), 1)); d = dt.toISOString().slice(0, 7); }
  var cs = caseOrd(), max = 0;
  mesi.forEach(function (m) { var s = 0; cs.forEach(function (c) { s += (r.mesi[m] || {})[c.id] || 0; }); max = Math.max(max, s); });
  if (!max) { el.innerHTML = '<div class="vuoto">Nessun incasso nel periodo</div>'; return; }
  var W = 900, H = 260, L = 56, B = 26, T = 10, bw = (W - L - 10) / mesi.length;
  var step = Math.pow(10, Math.floor(Math.log10(max))), top = Math.ceil(max / step) * step; if (top / step < 3) { step /= 2; }
  var s = '<svg viewBox="0 0 ' + W + ' ' + H + '" font-size="11" font-family="inherit">';
  for (var v = 0; v <= top + 1e-6; v += step) {
    var y = H - B - (H - B - T) * v / top;
    s += '<line x1="' + L + '" x2="' + (W - 10) + '" y1="' + y + '" y2="' + y + '" stroke="#e6dfd1"/><text x="' + (L - 6) + '" y="' + (y + 4) + '" text-anchor="end" fill="#6b7280">' + eur(v) + '</text>';
  }
  mesi.forEach(function (m, i) {
    var x = L + i * bw + bw * 0.18, w = bw * 0.64, acc = 0, tot = 0;
    cs.forEach(function (c) {
      var v = (r.mesi[m] || {})[c.id] || 0; if (!v) return;
      var h = (H - B - T) * v / top, y = H - B - (H - B - T) * (acc + v) / top;
      s += '<rect x="' + x + '" y="' + y + '" width="' + w + '" height="' + Math.max(0, h - 1) + '" fill="' + c.colore + '" rx="2"><title>' + esc(c.nome) + ' · ' + MESI[+m.slice(5) - 1] + ': ' + eur(v) + '</title></rect>';
      acc += v; tot += v;
    });
    s += '<text x="' + (x + w / 2) + '" y="' + (H - 8) + '" text-anchor="middle" fill="#6b7280">' + MESI[+m.slice(5) - 1].slice(0, 3) + (mesi.length > 12 ? " '" + m.slice(2, 4) : '') + '</text>';
    if (tot) s += '<text x="' + (x + w / 2) + '" y="' + (H - B - (H - B - T) * tot / top - 4) + '" text-anchor="middle" fill="#1f2933" font-weight="600">' + (tot >= 1000 ? (tot / 1000).toFixed(1).replace('.', ',') + 'k' : Math.round(tot)) + '</text>';
  });
  el.innerHTML = s + '</svg>';
}

  h += '</table></div></div>';

  // calendari OTA
  h += '<div class="card"><div class="bar"><h2 style="margin:0">Calendari OTA collegati (importazione)</h2><div class="sp"></div><button class="btn sec" onclick="sincronizza()">⟳ Sincronizza ora</button></div>' +
    '<p class="muted small" style="margin-top:-4px">Incolla qui il link iCal di <b>esportazione</b> fornito da ciascuna piattaforma. Il sistema li scarica automaticamente ogni 30 minuti.</p>';
  caseOrd().filter(function (c) { return c.ota; }).forEach(function (c) {
    h += '<div class="sez"><span class="dot" style="background:' + c.colore + '"></span>' + esc(c.nome) + '</div><table>';
    CANALI_OTA.forEach(function (f) {
      var cal = D.Calendari.find(function (x) { return x.casaId === c.id && x.fonte === f; }) || {};
      h += '<tr><td style="width:110px"><b>' + f + '</b></td><td><input placeholder="https://… .ics" value="' + esc(cal.url || '') + '" onchange="salvaCal(\'' + c.id + '\',\'' + f + '\',this.value)"></td><td class="small" style="width:220px">' +
        (cal.ultimoSync ? '<span class="tag ' + (String(cal.esito).indexOf('ERRORE') === 0 ? 'err' : 'ok') + '">' + esc(cal.esito) + '</span><div class="muted">' + new Date(cal.ultimoSync).toLocaleString('it-IT') + '</div>' : '<span class="muted">mai sincronizzato</span>') + '</td></tr>';
    });
    h += '</table>';
  });
  h += '</div>';

  // feed di esportazione
  var base = D.feedBase || '';
  h += '<div class="card"><h2>Link da dare alle OTA (esportazione)</h2><p class="muted small" style="margin-top:-6px">Ogni piattaforma deve importare il proprio link: riceve le prenotazioni dirette e quelle delle <b>altre</b> OTA (non le sue, per evitare doppioni).</p>' +
    '<label>URL del deployment "Feed" (vedi guida, passo 6)</label><div class="bar"><input id="feedBase" value="' + esc(base) + '" placeholder="https://script.google.com/macros/s/…/exec"><button class="btn sm" onclick="salvaFeed()">Salva</button></div>';
  if (base) {
    caseOrd().filter(function (c) { return c.ota; }).forEach(function (c) {
      h += '<div class="sez"><span class="dot" style="background:' + c.colore + '"></span>' + esc(c.nome) + '</div><table>';
      CANALI_OTA.forEach(function (f) {
        var u = base + '?feed=' + encodeURIComponent(c.id) + '&t=' + encodeURIComponent(D.token) + '&x=' + f.toLowerCase();
        h += '<tr><td style="width:110px"><b>' + f + '</b></td><td><code class="u">' + esc(u) + '</code></td><td style="width:80px"><button class="btn sm sec" onclick="copia(\'' + esc(u) + '\')">Copia</button></td></tr>';
      });
      h += '</table>';
    });
  }
  h += '</div>';

  // tassa, commissioni, host
  var campo = function (k, l, w) { return '<div' + (w ? ' class="w2"' : '') + '><label>' + l + '</label><input value="' + esc(imp(k)) + '" onchange="salvaImp(\'' + k + '\',this.value)"></div>'; };
  h += '<div class="grid g2"><div class="card"><h2>Tassa di soggiorno</h2><div class="f">' + campo('tassaImporto', '€ a persona a notte') + campo('tassaEta', 'Paga chi ha più di (anni)') + campo('tassaMaxNotti', 'Notti massime consecutive') + campo('tassaMesi', 'Mesi (numeri separati da virgola)') + '</div></div>';
  h += '<div class="card"><h2>Commissioni OTA predefinite (%)</h2><div class="f">' + CANALI_OTA.map(function (c) { return campo('comm_' + c, c); }).join('') + '</div><p class="small muted">Precompilano la commissione: puoi sempre correggerla nella singola prenotazione con l\'importo reale.</p></div></div>';
  h += '<div class="card"><h2>Host per l\'accoglienza</h2><p class="muted small" style="margin-top:-6px">Con il numero di telefono compare il pulsante WhatsApp per mandare all\'host i dettagli di arrivo/partenza.</p><div class="f">' + HOST_DEFAULT.map(function (x) { return campo('host_' + x, 'Telefono ' + x); }).join('') + '</div></div>';
  h += '<div class="card"><h2>Backup</h2><button class="btn sec" onclick="backup()">Scarica backup completo (JSON)</button> <button class="btn sec" onclick="esportaCsv()">Esporta prenotazioni (CSV)</button></div>';
  return h;
}
function aggCasaTxt(id, k, v) { var c = Object.assign({}, casa(id)); c[k] = v; salva('Case', c).then(function () { render(); toast('Salvato'); }).catch(errore); }
function salvaCal(casaId, fonte, url) {
  var c = D.Calendari.find(function (x) { return x.casaId === casaId && x.fonte === fonte; });
  if (!url.trim() && c) { elimina('Calendari', c.id).then(function () { toast('Calendario rimosso'); }); return; }
  c = Object.assign({ casaId: casaId, fonte: fonte, ultimoSync: '', esito: '' }, c || {}, { url: url.trim() });
  salva('Calendari', c).then(function () { toast('Link salvato'); }).catch(errore);
}
function salvaImp(k, v) { salva('Impostazioni', { chiave: k, valore: v }).then(function () { toast('Salvato'); }).catch(errore); }
function salvaFeed() { var u = $('feedBase').value.trim(); API.feedUrl(u).then(function () { D.feedBase = u; render(); toast('Salvato'); }).catch(errore); }
function copia(t) { (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(function () { toast('Link copiato'); }).catch(function () { prompt('Copia il link:', t); }); }
function backup() {
  var b = new Blob([JSON.stringify(D, null, 1)], { type: 'application/json' }), a = document.createElement('a');
  a.href = URL.createObjectURL(b); a.download = 'backup-gestionale-noli-' + oggi() + '.json'; a.click();
}

avvia();
</script>
</body>
</html>
